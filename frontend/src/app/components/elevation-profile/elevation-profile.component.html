@if (plot_options != {}) {
  <div class="elevation-map">
    <div
      id="chart"
      (chartInit)="onChartInit($event)"
      echarts
      [options]="plot_options"
    ></div>
    <ul class="surface-legend" aria-label="Belag">
      @for (surface of surfaceLegend; track surface.label) {
        <li>
          <span class="swatch" [style.background]="surface.color"></span
          >{{ surface.label }}
        </li>
      }
    </ul>
    <p class="hint">
      Mit einem Klick ins Höhenprofil oder auf der Karte kannst du zusätzliche
      Wegpunkte einfügen. Ein erneuter Klick an derselben Stelle löscht den
      Wegpunkt wieder.
    </p>
  </div>
}
