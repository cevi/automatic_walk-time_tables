<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fonts of the J+S walk-time table template that are not installed in the container: substitute
     them with a sans serif font, otherwise LibreOffice falls back to a monospace font in the PDF. -->
<fontconfig>
  <alias binding="same">
    <family>Frutiger LT 45 Light</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>MS Sans Serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
